<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <h1>Table Example</h1>
    <table border="1">
        <tr>
            <th>country</th>
            <th>capital</th>
            <th>population</th>
        </tr>
        <tr>
            <td>Russia</td>
            <td>Moscow</td>
            <td>146,000,000</td>
        </tr>
        <tr>
            <td>Canada</td>
            <td>Ottawa</td>
            <td>38,000,000</td>
        </tr>
        <tr>
            <td>China</td>
            <td>Beijing</td>
            <td>1,400,000,000</td>
        </tr>
        <tr>
            <td>USA</td>
            <td>Washington D.C.</td>
            <td>331,000,000</td>
        </tr>
        
    </table>

</html>
