<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Contact us</h1>
    <form action="https://www.example.com/contact" method="post">
        <label for="fname">First Name:</label><br>
        <input type="text" id="fname" name="fname"><br><br>
        <label for="lname">Last Name:</label><br>
        <input type="text" id="lname" name="lname"><br><br>     
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>
        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone"><br><br>
        <label for="gender">Gender:</label><br>
        <select id="gender" name="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select><br><br>
        <lrabel for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>
        <label for="upload">Upload File:</label><br>
        <input type="file" id="upload" name="upload"><br><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br><br    >
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>
        <input type="submit" value="Submit">
    </form>

    <h2>Support Form</h2>
    <form action="https://www.googlemaps.com/support" method="post">
        <label for="issue">Describe your issue:</label><br>
        <textarea id="issue" name="issue" rows="4" cols="50"></textarea><br><br>
        <input type="submit" value="Submit">
    </form>
</html>
