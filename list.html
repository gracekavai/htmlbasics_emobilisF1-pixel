<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>list</title>
</head>
<body>
    <h1>Lists OF Countries</h1>
    <p>HTML provides several types of lists to organize content:</p>
    <ol>
        <li>kenya</li>
        <li>Uganda</li>
        <li>Tanzania</li>

    </ol>
    <h2>Unordered List</h2>
    <ul>
        <li>Rwanda</li>
        <li>Burundi</li>
        <li>South Sudan</li> 
    </ul>   
</body>
</html>
